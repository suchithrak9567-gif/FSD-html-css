<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="Taskstyle.css">
</head>
<body>
    <form class="form">
        <br>
        <br>
        <label for="Name">Enter Your Name :</label>
        <input id="Name" type="text" placeholder="Enter Your Name" required >
        <br>
        <br>
        <br>
        <label for="Email"> Enter Your Email :</label>
        <input id="Email" type="email" placeholder="Enter Your Email Id" required>
        <br>
        <br>
        <br>
        <label for="Password"> Enter Your Password :</label>
        <input id="Password" placeholder="Enter Your Password" required>
        <br>
        <br>
        <br>
        <label for="gender">Male</label>
        <input type="radio" name="gender">
           <label for="gender">Female</label>
           <input type="radio" name="gender">
           <br>
           <br>
           <br>
        

         <input id="employee" type="checkbox" name="employee">
               <label for="employee">Employee</label>
         <input id="unemployee" type="checkbox" name="unemployee">
                <label for="unemployee">UnEmployee</label>
         <input id="student" type="checkbox" name="student">
                <label for="student">Student</label>
         <input id="Business" type="checkbox" name="Business">
          <label for="Business">Business Man</label>
         <br>
         <br>
         <br>
         <button>Register Now</button>
         <br>
         <br>
    </form>
</body>
</html>
